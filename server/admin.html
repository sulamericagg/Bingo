<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0d0726" />
<title>Painel Bloop World</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🪐%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0d0726;
  --bg2: #170b3b;
  --card: rgba(36, 22, 84, 0.72);
  --card2: rgba(52, 33, 112, 0.6);
  --line: rgba(160, 130, 255, 0.18);
  --text: #f4efff;
  --muted: #a99bd6;
  --purple: #8b5cf6;
  --pink: #ff4fd8;
  --cyan: #22e1ff;
  --yellow: #ffd84d;
  --green: #3ee69a;
  --red: #ff5a7a;
  --radius: 18px;
  --shadow: 0 10px 30px rgba(5, 0, 25, 0.45);
  --nav-h: 66px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: var(--text);
  background: var(--bg);
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, #fff8 50%, transparent 51%),
    radial-gradient(1px 1px at 70% 20%, #fff6 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 40% 80%, #fff5 50%, transparent 51%),
    radial-gradient(1px 1px at 85% 65%, #fff7 50%, transparent 51%),
    radial-gradient(1px 1px at 10% 90%, #fff5 50%, transparent 51%),
    radial-gradient(900px 600px at 100% 0%, rgba(255, 79, 216, 0.16), transparent 60%),
    radial-gradient(800px 600px at 0% 100%, rgba(34, 225, 255, 0.12), transparent 60%),
    linear-gradient(160deg, #0d0726 0%, #1a0c45 55%, #0d0726 100%);
  background-attachment: fixed;
  background-size: 300px 300px, 260px 260px, 340px 340px, 280px 280px, 320px 320px, auto, auto, auto;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--cyan); }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 0.02em; }
h1, h2, h3 { margin: 0; font-weight: 600; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.1rem; }

/* ---------- Botões / campos ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 14px; padding: 11px 18px; cursor: pointer;
  font-weight: 600; font-size: 0.98rem; color: #fff;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  box-shadow: 0 6px 18px rgba(255, 79, 216, 0.28), inset 0 -3px 0 rgba(0,0,0,.18);
  transition: transform .12s, filter .12s, opacity .12s;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px) scale(.98); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.cyan { background: linear-gradient(135deg, #1aa6ff, var(--cyan)); color: #04122b; box-shadow: 0 6px 18px rgba(34,225,255,.25), inset 0 -3px 0 rgba(0,0,0,.15); }
.btn.ghost { background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.ghost:hover { background: rgba(255,255,255,0.1); }
.btn.danger { background: rgba(255, 90, 122, 0.14); color: #ffb3c3; box-shadow: inset 0 0 0 1.5px rgba(255,90,122,.35); }
.btn.sm { padding: 7px 12px; font-size: 0.86rem; border-radius: 11px; }
.btn.icon { padding: 7px 10px; }
label.field, div.field { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; color: var(--muted); }
input[type=text], input[type=password], input[type=number], input[type=url], input[type=search], input[type=datetime-local], select, textarea {
  width: 100%; padding: 11px 13px; border-radius: 12px; border: 1.5px solid var(--line);
  background: rgba(10, 4, 34, 0.55); color: var(--text); outline: none; font-size: 1rem;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,225,255,.15); }
textarea { resize: vertical; min-height: 70px; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
select option { background: #1a0c45; }
input[type=datetime-local]::-webkit-calendar-picker-indicator { filter: invert(1) opacity(.7); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.row > * { flex: 1 1 160px; min-width: 0; }
select, input, textarea { max-width: 100%; }
.grid2 > *, .stats > * { min-width: 0; }
.row.tight { flex-wrap: nowrap; }
.row.tight > * { flex: 0 0 auto; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }

.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; color: var(--text); font-size: .95rem; }
.switch input { display: none; }
.switch .track { width: 44px; height: 26px; border-radius: 99px; background: rgba(255,255,255,.12); position: relative; transition: background .2s; flex: none; }
.switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.switch input:checked + .track { background: linear-gradient(135deg, var(--green), var(--cyan)); }
.switch input:checked + .track::after { transform: translateX(18px); }

/* ---------- Cartões ---------- */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.card + .card { margin-top: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: .78rem; font-weight: 600; background: rgba(255,255,255,.08); color: var(--muted); white-space: nowrap; }
.pill.on { background: rgba(62,230,154,.15); color: var(--green); }
.pill.off { background: rgba(255,90,122,.14); color: #ff9db1; }
.pill.warn { background: rgba(255,216,77,.14); color: var(--yellow); }
.pill.info { background: rgba(34,225,255,.12); color: var(--cyan); }
.pill.pink { background: rgba(255,79,216,.14); color: #ff9be9; }

/* ---------- Login ---------- */
#login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.login-card { width: min(400px, 100%); text-align: center; padding: 34px 26px; }
.logo { font-size: 64px; filter: drop-shadow(0 0 22px rgba(255,79,216,.55)); animation: float 4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-8px) rotate(-6deg); } }
.brand { font-size: 1.9rem; font-weight: 700; background: linear-gradient(90deg, var(--yellow), var(--pink), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.login-card form { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; text-align: left; }
.err { color: #ff9db1; font-size: .9rem; min-height: 1.2em; }

/* ---------- Layout ---------- */
#app { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 22px 14px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line); background: rgba(10, 4, 34, .4); backdrop-filter: blur(8px); }
.side .brandrow { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.side .brandrow span:first-child { font-size: 32px; }
.side .brandrow b { font-size: 1.15rem; display: block; line-height: 1.1; }
.nav button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-radius: 14px; background: transparent; color: var(--muted); font-size: 1rem; font-weight: 500; cursor: pointer; text-align: left; transition: background .15s, color .15s; }
.nav button .ic { font-size: 1.25rem; width: 26px; text-align: center; }
.nav button:hover { background: rgba(255,255,255,.05); color: var(--text); }
.nav button.active { background: linear-gradient(135deg, rgba(139,92,246,.35), rgba(255,79,216,.25)); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.side .spacer { flex: 1; }
main { padding: 26px clamp(14px, 3vw, 36px) 40px; max-width: 1180px; width: 100%; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; }
.topbar { display: none; }

/* ---------- Painel ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat { padding: 16px 18px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); position: relative; overflow: hidden; }
.stat::after { content: ''; position: absolute; right: -30px; top: -30px; width: 100px; height: 100px; border-radius: 50%; background: var(--glow, rgba(139,92,246,.25)); filter: blur(18px); }
.stat .v { font-size: 2rem; font-weight: 700; line-height: 1.1; margin-top: 4px; }
.stat .l { color: var(--muted); font-size: .9rem; display: flex; gap: 6px; align-items: center; }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.quick button { padding: 18px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card2); color: var(--text); text-align: left; cursor: pointer; transition: transform .15s, border-color .15s; }
.quick button:hover { transform: translateY(-2px); border-color: var(--pink); }
.quick button b { display: block; font-size: 1.05rem; margin-top: 6px; }
.quick button span { font-size: 1.6rem; }
.toplist { list-style: none; margin: 0; padding: 0; }
.toplist li { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.toplist li:last-child { border: 0; }

/* ---------- Tabelas ---------- */
.table-wrap { overflow-x: auto; margin: 0 -6px; }
table { width: 100%; border-collapse: collapse; font-size: .94rem; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: .82rem; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 8px; border-bottom: 1px solid rgba(160,130,255,.08); vertical-align: middle; }
tr.sel td { background: rgba(139,92,246,.12); }
tbody tr:hover td { background: rgba(255,255,255,.03); }
td.clickable { cursor: pointer; }
input[type=checkbox].ck { width: 19px; height: 19px; accent-color: var(--pink); cursor: pointer; }
.uses-bar { height: 6px; width: 90px; border-radius: 9px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 4px; }
.uses-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--pink)); }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.empty { text-align: center; padding: 34px 10px; color: var(--muted); }
.empty div { font-size: 42px; margin-bottom: 6px; }
.actionbar { position: sticky; bottom: 14px; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px 12px 18px; margin-top: 14px; border-radius: 16px; background: linear-gradient(135deg, rgba(139,92,246,.95), rgba(255,79,216,.92)); box-shadow: 0 12px 30px rgba(255,79,216,.35); flex-wrap: wrap; }
.actionbar .btn { background: #fff; color: #5a1a9c; box-shadow: none; }

/* ---------- Editor de pacote ---------- */
.pack { display: flex; flex-direction: column; gap: 16px; }
.pack .sect-title { font-size: .85rem; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.money { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.money .box { padding: 12px; border-radius: 14px; background: rgba(10,4,34,.4); border: 1px solid var(--line); }
.money .box .lbl { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 8px; }
.quickadd { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.quickadd button { flex: 1; padding: 5px 0; border-radius: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--muted); cursor: pointer; font-size: .8rem; min-width: 46px; }
.quickadd button:hover { color: #fff; border-color: var(--cyan); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px 7px 8px; border-radius: 99px; border: 1.5px solid var(--line); background: rgba(10,4,34,.4); cursor: pointer; font-size: .9rem; user-select: none; transition: border-color .15s, background .15s; }
.chip input { display: none; }
.chip .dot { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 0 0 2px rgba(255,255,255,.1); flex: none; }
.chip .stripe { width: 26px; height: 12px; border-radius: 6px; flex: none; }
.chip.on { border-color: var(--pink); background: rgba(255,79,216,.16); color: #fff; }
.chip.on::after { content: '✓'; color: var(--pink); font-weight: 700; }
.chip .r { font-size: .7rem; color: var(--muted); }
.boosts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.boosts label.field { justify-content: flex-end; }
.summary { padding: 12px 14px; border-radius: 14px; background: linear-gradient(135deg, rgba(34,225,255,.1), rgba(255,79,216,.1)); border: 1px dashed rgba(34,225,255,.35); font-size: .95rem; }
.summary b { color: var(--yellow); }
details.more summary { cursor: pointer; color: var(--muted); font-size: .9rem; padding: 4px 0; }

/* ---------- Modal / toast ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(5, 0, 20, .72); backdrop-filter: blur(4px); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 30px 14px; overflow-y: auto; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(680px, 100%); background: linear-gradient(180deg, #24135a, #170b3b); border: 1px solid var(--line); border-radius: 22px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: pop .18s; }
.modal.sm { width: min(420px, 100%); }
@keyframes pop { from { transform: translateY(14px) scale(.98); opacity: 0; } }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.x { border: 0; background: rgba(255,255,255,.07); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; color: var(--muted); flex: none; }
.toasts { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; width: min(420px, calc(100% - 28px)); pointer-events: none; }
.toast { padding: 12px 16px; border-radius: 14px; background: #2a1767; border: 1px solid var(--line); box-shadow: var(--shadow); animation: pop .2s; font-weight: 500; }
.toast.ok { border-color: rgba(62,230,154,.5); }
.toast.bad { border-color: rgba(255,90,122,.6); }
.seg { display: inline-flex; padding: 4px; border-radius: 14px; background: rgba(10,4,34,.5); border: 1px solid var(--line); gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; padding: 8px 14px; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; font-weight: 500; }
.seg button.on { background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; }
.target-opts { display: flex; flex-direction: column; gap: 8px; }
.target-opts label { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); cursor: pointer; background: rgba(10,4,34,.35); }
.target-opts label:has(input:checked) { border-color: var(--cyan); background: rgba(34,225,255,.08); }
.target-opts input[type=radio] { accent-color: var(--cyan); width: 18px; height: 18px; }
.target-opts input[type=number] { width: 80px; padding: 6px 8px; }
.share { white-space: pre-wrap; padding: 14px; border-radius: 14px; background: rgba(10,4,34,.55); border: 1px solid var(--line); font-size: .95rem; line-height: 1.45; }
.ch-card { display: flex; flex-direction: column; gap: 10px; }
.ch-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.codebig { font-size: 1.25rem; font-weight: 700; letter-spacing: .06em; color: var(--yellow); }
.list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: var(--pink); animation: spin .8s linear infinite; margin: 30px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .95rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-all; }
.mobile-only { display: none; }

/* ---------- Painel 2 ---------- */
.notice { padding: 12px 14px; border-radius: 14px; background: rgba(255,216,77,.09); border: 1px dashed rgba(255,216,77,.5); color: #ffe9a3; font-size: .92rem; line-height: 1.45; }
.notice.bad { background: rgba(255,90,122,.1); border-color: rgba(255,90,122,.5); color: #ffc2cf; margin-top: 12px; }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: 84px 1fr 40px; gap: 8px; align-items: center; }
.bar span:nth-child(2) { background: rgba(255,255,255,.06); border-radius: 6px; height: 12px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--cyan), var(--pink)); min-width: 3px; }
.picker-list { max-height: 340px; overflow-y: auto; border: 1px solid var(--line); border-radius: 14px; background: rgba(10,4,34,.35); }
.picker-list label { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid rgba(160,130,255,.08); cursor: pointer; flex-wrap: wrap; }
.picker-list label:last-child { border-bottom: 0; }
.modal.wide { width: min(880px, 100%); }
.phead { display: flex; gap: 14px; align-items: center; }
.phead .avatar { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 1.6rem; font-weight: 700; background: linear-gradient(135deg, var(--purple), var(--pink)); flex: none; }
.phead .big { font-size: 1.3rem; font-weight: 700; }
.actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.actions-grid .btn { white-space: normal; }
li.clickable { cursor: pointer; }
td.acts { white-space: nowrap; text-align: right; }
.switch.small { font-size: .9rem; }

/* ---------- Celular ---------- */
@media (max-width: 820px) {
  html, body { overflow-x: hidden; }
  .table-wrap { margin: 0; }
  td.acts { white-space: normal; width: 64px; }
  td.acts .btn { margin: 2px 0; width: 100%; }
  #app { grid-template-columns: minmax(0, 1fr); }
  main { min-width: 0; }
  .side { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding: 6px 6px env(safe-area-inset-bottom); flex-direction: row; z-index: 20; border-right: 0; border-top: 1px solid var(--line); background: rgba(13, 7, 38, .92); }
  .side .brandrow, .side .spacer, .side .logout { display: none; }
  .nav { display: flex; width: 100%; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { flex: 0 0 auto; width: auto; min-width: 70px; flex-direction: column; gap: 2px; padding: 7px 6px; font-size: .68rem; text-align: center; justify-content: center; border-radius: 12px; }
  .nav button .ic { font-size: 1.35rem; width: auto; }
  main { padding: 0 14px calc(var(--nav-h) + 30px); }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px 6px; position: sticky; top: 0; z-index: 10; background: linear-gradient(180deg, var(--bg) 70%, transparent); }
  .topbar b { font-size: 1.1rem; }
  .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat .v { font-size: 1.6rem; }
  .card { padding: 15px; }
  .hide-m { display: none; }
  .mobile-only { display: initial; }
  .boosts { grid-template-columns: 1fr 1fr 1fr; }
  .money { grid-template-columns: 1fr; }
  .modal { padding: 18px 16px; }
  .modal-bg { padding: 12px 8px; }
  .actionbar { bottom: calc(var(--nav-h) + 12px); }
  .list-grid { grid-template-columns: 1fr; }
  .bar { grid-template-columns: 74px 1fr 34px; }
  .modal.wide { padding: 18px 14px; }
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dd { margin-bottom: 8px; }
}

/* Moderação da Loja/TV */
.ugc-card { display: grid; grid-template-columns: minmax(180px, 300px) 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid rgba(127,127,160,.25); }
.ugc-card:first-child { border-top: 0; }
.ugc-thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; align-content: start; }
.ugc-thumbs img { width: 100%; aspect-ratio: 3/2; object-fit: cover; border-radius: 8px; background: #0002; }
.ugc-thumbs.big { grid-template-columns: repeat(3, 1fr); margin-bottom: 10px; }
.ugc-nothumb { grid-column: 1 / -1; padding: 30px 0; text-align: center; border-radius: 8px; background: #0002; font-size: 12px; opacity: .7; }
.ugc-body h4 { margin: 6px 0 4px; }
.ugc-flags { margin: 6px 0; padding-left: 18px; color: #ff8a8a; font-size: 13px; }
.ugc-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.ugc-lines { max-height: 300px; overflow: auto; display: grid; gap: 6px; }
.ugc-lines audio { height: 32px; margin-top: 4px; }
.ugc-line { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: start; padding: 6px 0; border-top: 1px solid rgba(127,127,160,.18); }
.ugc-line:first-child { border-top: 0; }
.ugc-tx { font-size: 12.5px; padding: 6px 8px; border-radius: 8px; background: rgba(255,255,255,.05); }
.ugc-tx.bad, .ugc-tx.pii { background: #ff5c7a22; outline: 1px solid #ff5c7a66; }
.ugc-tx.mild { background: rgba(255,216,77,.10); outline: 1px solid rgba(255,216,77,.4); }
.ugc-tx mark { background: #ff5c7a; color: #fff; border-radius: 4px; padding: 0 3px; }
.ugc-tx.mild mark { background: var(--yellow); color: #222; }
@media (max-width: 640px) { .ugc-line { grid-template-columns: 1fr; } }
.pill.bad { background: #ff5c7a33; color: #ff8a8a; }
@media (max-width: 640px) { .ugc-card { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="toasts" id="toasts"></div>

<!-- LOGIN -->
<section id="login" class="hidden">
  <div class="card login-card">
    <div class="logo">🪐</div>
    <div class="brand">Bloop World</div>
    <div class="muted">Painel do administrador</div>
    <form id="loginForm">
      <label class="field">Senha
        <input type="password" id="pw" autocomplete="current-password" placeholder="Digite a senha do painel" required />
      </label>
      <label class="field">Seu nome <span class="small">(opcional — aparece no Registro)</span>
        <input type="text" id="who" maxlength="24" autocomplete="nickname" placeholder="ex.: Ross" />
      </label>
      <div class="err" id="loginErr"></div>
      <button class="btn" type="submit" id="loginBtn">🚀 Entrar</button>
    </form>
    <p class="muted small" style="margin-top:18px">A senha é o segredo <b>ADMIN_PASSWORD</b> configurado na Cloudflare. <b>Moderadores:</b> digite seu nome de moderador e a sua senha.</p>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="brandrow"><span>🪐</span><span><b>Bloop World</b><span class="muted small">Painel admin</span></span></div>
    <nav class="nav" id="nav">
      <button data-tab="dash"><span class="ic">📊</span><span>Painel</span></button>
      <button data-tab="players"><span class="ic">👥</span><span>Jogadores</span></button>
      <button data-tab="payments"><span class="ic">💳</span><span>Pagamentos</span></button>
      <button data-tab="gifts"><span class="ic">🎁</span><span>Presentes</span></button>
      <button data-tab="codes"><span class="ic">🔑</span><span>Códigos</span></button>
      <button data-tab="challenges"><span class="ic">🎬</span><span>Desafios</span></button>
      <button data-tab="presets"><span class="ic">📦</span><span>Pacotes</span></button>
      <button data-tab="ranking"><span class="ic">🏆</span><span>Ranking</span></button>
      <button data-tab="ugc"><span class="ic">&#128737;</span><span>Moderação</span></button>
      <button data-tab="moderation"><span class="ic">&#9873;</span><span>Chat</span></button>
      <button data-tab="champs"><span class="ic">&#9733;</span><span>Campeonatos</span></button>
      <button data-tab="beta"><span class="ic">&#128030;</span><span>Beta / Bugs</span></button>
      <button data-tab="audit"><span class="ic">📜</span><span>Registro</span></button>
      <button data-tab="mods"><span class="ic">&#128110;</span><span>Moderadores</span></button>
    </nav>
    <div class="spacer"></div>
    <button class="btn ghost sm logout" onclick="logout()">↩ Sair</button>
  </aside>
  <main>
    <div class="topbar"><b>🪐 Bloop World</b><button class="btn ghost sm" onclick="logout()">Sair</button></div>
    <div id="view"></div>
  </main>
</div>

<script>
'use strict';
/* ================= Estado ================= */
const TOKEN_KEY = 'bo-admin-token';
let token = '';
try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
try { const w = localStorage.getItem('bo-admin-who'); if (w) document.getElementById('who').value = w; } catch (e) {}
let CATALOG = { skins: [], trails: [], boosts: [] };
let PRESETS = [];
const NAMES = {};
let currentTab = 'dash';
/** 'owner' (senha do painel) ou 'mod' (moderador: só a página Moderação) */
let ROLE = 'owner';
const MOD_TABS = ['ugc'];
const ALL_TABS = ['dash', 'players', 'payments', 'gifts', 'codes', 'challenges', 'presets', 'ranking', 'ugc', 'moderation', 'champs', 'beta', 'audit', 'mods'];
let SEASONS = { current: null, next: null, list: [] };
let PRODUCTS = {};
const players = { q: '', filter: 'all', sort: 'lastSeen', page: 1, size: 50, selected: new Set(), data: null };
const codesState = { q: '', filter: 'all', batch: '' , items: [] };

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = (n) => Number(n || 0).toLocaleString('pt-BR');
const fmtDate = (ms) => (ms ? new Date(ms).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—');
const fmtDay = (ms) => (ms ? new Date(ms).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—');
function ago(ms) {
  if (!ms) return 'nunca';
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 90) return 'agora';
  if (s < 3600) return Math.round(s / 60) + ' min atrás';
  if (s < 86400) return Math.round(s / 3600) + ' h atrás';
  const d = Math.round(s / 86400);
  return d === 1 ? 'ontem' : d + ' dias atrás';
}
function toLocalInput(ms) {
  if (!ms) return '';
  const d = new Date(ms - new Date(ms).getTimezoneOffset() * 60000);
  return d.toISOString().slice(0, 16);
}
const fromLocalInput = (v) => (v ? new Date(v).getTime() : null);

/* ================= API ================= */
async function api(method, path, body) {
  const res = await fetch('/api/admin' + path, {
    method,
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && path !== '/login') { logout(true); throw new Error(data.message || 'Sessão expirada'); }
  if (!res.ok) throw new Error(data.message || 'Erro ' + res.status);
  return data;
}

/* ================= UI util ================= */
function toast(msg, kind = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), kind === 'bad' ? 5000 : 3000);
}
function modal(html, cls = '') {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${cls}">${html}</div>`;
  document.body.appendChild(bg);
  document.body.style.overflow = 'hidden';
  const close = () => { bg.remove(); if (!$('.modal-bg')) document.body.style.overflow = ''; };
  bg.addEventListener('mousedown', (e) => { if (e.target === bg) close(); });
  $$('[data-close]', bg).forEach((b) => b.addEventListener('click', close));
  return { el: bg, close };
}
function ask(title, text, okLabel = 'Confirmar', danger = false) {
  return new Promise((resolve) => {
    const m = modal(`<div class="modal-head"><h3>${esc(title)}</h3></div><p class="muted">${esc(text)}</p>
      <div class="modal-foot"><button class="btn ghost" data-close>Cancelar</button><button class="btn ${danger ? 'danger' : ''}" id="askOk">${esc(okLabel)}</button></div>`, 'sm');
    $('#askOk', m.el).onclick = () => { m.close(); resolve(true); };
    $$('[data-close]', m.el).forEach((b) => b.addEventListener('click', () => resolve(false)));
  });
}
async function copy(text, msg = 'Copiado!') {
  try { await navigator.clipboard.writeText(text); toast('📋 ' + msg); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('📋 ' + msg); } catch (e2) { toast('Não foi possível copiar', 'bad'); }
    ta.remove();
  }
}
function download(name, content, type = 'text/csv') {
  const blob = new Blob(['﻿' + content], { type: type + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function busy(btn, fn) {
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '⏳ Aguarde…';
  try { return await fn(); } catch (e) { toast(e.message, 'bad'); } finally { btn.disabled = false; btn.innerHTML = old; }
}
const spinner = () => '<div class="spinner"></div>';

/* ================= Pacotes (resumo + editor) ================= */
function plural(n, one, many) { return fmtN(n) + ' ' + (n === 1 ? one : many); }
function packSummary(p) {
  p = p || {};
  const parts = [];
  if (p.coins) parts.push('🪙 ' + plural(p.coins, 'moeda', 'moedas'));
  if (p.gems) parts.push('💎 ' + plural(p.gems, 'gema', 'gemas'));
  if (p.skins && p.skins.length) parts.push('🎨 ' + (p.skins.length === 1 ? 'skin ' : 'skins ') + p.skins.map((s) => NAMES['s:' + s] || s).join(', '));
  if (p.trails && p.trails.length) parts.push('✨ ' + (p.trails.length === 1 ? 'rastro ' : 'rastros ') + p.trails.map((s) => NAMES['t:' + s] || s).join(', '));
  const b = p.boosts || {};
  if (b.shield) parts.push('🛡️ ' + plural(b.shield, 'escudo', 'escudos'));
  if (b.magnet) parts.push('🧲 ' + plural(b.magnet, 'ímã', 'ímãs'));
  if (b.headstart) parts.push('🚀 ' + plural(b.headstart, 'largada turbo', 'largadas turbo'));
  if (p.noAds) parts.push('🚫 sem anúncios');
  if (p.passSeason !== undefined && p.passSeason !== null) parts.push('👑 Passe premium (temporada ' + (p.passSeason + 1) + ')');
  if (p.clubDays) parts.push('⭐ ' + plural(p.clubDays, 'dia de Clube', 'dias de Clube'));
  return parts.length ? parts.join(' · ') : '<span class="muted">nada ainda</span>';
}
const RARITY = { common: 'comum', rare: 'rara', epic: 'épica', legendary: 'lendária' };
let peSeq = 0;
function packEditor(host, initial, opts = {}) {
  const id = 'pe' + ++peSeq;
  const presetOpts = PRESETS.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  host.innerHTML = `
  <div class="pack">
    ${opts.noPresets ? '' : `<div class="row"><label class="field">📦 Começar de um pacote salvo
      <select data-k="preset"><option value="">— escolher —</option>${presetOpts}</select></label></div>`}
    <div class="money">
      <div class="box"><div class="lbl">🪙 Moedas</div><input type="number" min="0" data-k="coins" placeholder="0" inputmode="numeric" />
        <div class="quickadd">${[100, 500, 1000, 5000].map((v) => `<button type="button" data-add="coins" data-v="${v}">+${fmtN(v)}</button>`).join('')}</div></div>
      <div class="box"><div class="lbl">💎 Gemas</div><input type="number" min="0" data-k="gems" placeholder="0" inputmode="numeric" />
        <div class="quickadd">${[10, 50, 100, 500].map((v) => `<button type="button" data-add="gems" data-v="${v}">+${fmtN(v)}</button>`).join('')}</div></div>
    </div>
    <div><div class="sect-title"><span>🎨 Skins</span><span class="muted small" data-count="skins"></span></div>
      <div class="chips" data-list="skins">${CATALOG.skins.map((s) => `<label class="chip" title="${esc(s.id)}"><input type="checkbox" value="${esc(s.id)}" /><span class="dot" style="background:radial-gradient(circle at 35% 30%, ${esc(s.colors[0])}, ${esc(s.colors[1])})"></span>${esc(s.name)} <span class="r">${esc(RARITY[s.rarity] || '')}</span></label>`).join('')}</div></div>
    <div><div class="sect-title"><span>✨ Rastros</span><span class="muted small" data-count="trails"></span></div>
      <div class="chips" data-list="trails">${CATALOG.trails.map((t) => `<label class="chip" title="${esc(t.id)}"><input type="checkbox" value="${esc(t.id)}" /><span class="stripe" style="background:linear-gradient(90deg, ${t.colors.map(esc).join(',')})"></span>${esc(t.name)}</label>`).join('')}</div></div>
    <div><div class="sect-title"><span>⚡ Power-ups (quantidade)</span></div>
      <div class="boosts">${CATALOG.boosts.map((b) => `<label class="field">${{ shield: '🛡️', magnet: '🧲', headstart: '🚀' }[b.id] || '⚡'} ${esc(b.name)}<input type="number" min="0" max="999" data-boost="${esc(b.id)}" placeholder="0" inputmode="numeric" /></label>`).join('')}</div></div>
    <div class="grid2">
      <label class="field">👑 Passe Estelar premium<select data-k="passSeason"><option value="">— não dar —</option>${(SEASONS.list || []).map((w) => `<option value="${w.index}">Temporada ${w.index + 1} (${fmtDay(w.start)})${SEASONS.current && SEASONS.current.index === w.index ? ' — atual' : ''}</option>`).join('')}</select></label>
      <label class="field">⭐ Clube Bloop (dias)<input type="number" min="0" max="3650" data-k="clubDays" placeholder="0" inputmode="numeric" /></label>
    </div>
    <label class="switch"><input type="checkbox" data-k="noAds" /><span class="track"></span>🚫 Remover anúncios para sempre</label>
    <details class="more"><summary>Mais opções (IDs extras, título e mensagem)</summary>
      <div class="grid2" style="margin-top:10px">
        <label class="field">Skins extras (IDs separados por vírgula)<input type="text" data-k="extraSkins" placeholder="ex.: dragao, unicornio" /></label>
        <label class="field">Rastros extras (IDs)<input type="text" data-k="extraTrails" placeholder="ex.: neon" /></label>
        ${opts.noText ? '' : `<label class="field">Título mostrado no jogo<input type="text" maxlength="60" data-k="title" placeholder="ex.: Pack Lendário" /></label>
        <label class="field">Mensagem<input type="text" maxlength="300" data-k="message" placeholder="ex.: Valeu por jogar! 💜" /></label>`}
      </div>
    </details>
    <div class="summary" data-summary></div>
  </div>`;
  const q = (s) => host.querySelector(s);
  const known = { skins: new Set(CATALOG.skins.map((s) => s.id)), trails: new Set(CATALOG.trails.map((t) => t.id)) };
  const splitIds = (v) => v.split(/[,;\s]+/).map((s) => s.trim()).filter(Boolean);
  function get() {
    const p = {};
    const coins = +q('[data-k=coins]').value || 0; if (coins > 0) p.coins = Math.floor(coins);
    const gems = +q('[data-k=gems]').value || 0; if (gems > 0) p.gems = Math.floor(gems);
    for (const kind of ['skins', 'trails']) {
      const ids = $$(`[data-list=${kind}] input:checked`, host).map((i) => i.value);
      const extra = splitIds(q(`[data-k=extra${kind === 'skins' ? 'Skins' : 'Trails'}]`).value);
      const all = [...new Set([...ids, ...extra])];
      if (all.length) p[kind] = all;
    }
    const boosts = {};
    $$('[data-boost]', host).forEach((i) => { const n = Math.floor(+i.value || 0); if (n > 0) boosts[i.dataset.boost] = n; });
    if (Object.keys(boosts).length) p.boosts = boosts;
    if (q('[data-k=noAds]').checked) p.noAds = true;
    const ps = q('[data-k=passSeason]').value; if (ps !== '') p.passSeason = +ps;
    const cd = Math.floor(+q('[data-k=clubDays]').value || 0); if (cd > 0) p.clubDays = cd;
    const t = q('[data-k=title]'); if (t && t.value.trim()) p.title = t.value.trim();
    const m = q('[data-k=message]'); if (m && m.value.trim()) p.message = m.value.trim();
    return p;
  }
  function set(p) {
    p = p || {};
    q('[data-k=coins]').value = p.coins || '';
    q('[data-k=gems]').value = p.gems || '';
    for (const kind of ['skins', 'trails']) {
      const ids = p[kind] || [];
      $$(`[data-list=${kind}] input`, host).forEach((i) => { i.checked = ids.includes(i.value); });
      q(`[data-k=extra${kind === 'skins' ? 'Skins' : 'Trails'}]`).value = ids.filter((i) => !known[kind].has(i)).join(', ');
    }
    $$('[data-boost]', host).forEach((i) => { i.value = (p.boosts && p.boosts[i.dataset.boost]) || ''; });
    q('[data-k=noAds]').checked = !!p.noAds;
    const pss = q('[data-k=passSeason]');
    if (p.passSeason !== undefined && p.passSeason !== null && !pss.querySelector(`option[value="${p.passSeason}"]`)) pss.insertAdjacentHTML('beforeend', `<option value="${p.passSeason}">Temporada ${p.passSeason + 1}</option>`);
    pss.value = p.passSeason !== undefined && p.passSeason !== null ? String(p.passSeason) : '';
    q('[data-k=clubDays]').value = p.clubDays || '';
    const t = q('[data-k=title]'); if (t) t.value = p.title || '';
    const m = q('[data-k=message]'); if (m) m.value = p.message || '';
    refresh();
  }
  function refresh() {
    $$('.chip', host).forEach((c) => c.classList.toggle('on', c.querySelector('input').checked));
    for (const kind of ['skins', 'trails']) {
      const n = $$(`[data-list=${kind}] input:checked`, host).length;
      q(`[data-count=${kind}]`).textContent = n ? n + ' selecionada' + (n > 1 ? 's' : '') : '';
    }
    q('[data-summary]').innerHTML = '🎁 O jogador vai ganhar: <b>' + packSummary(get()) + '</b>';
    if (opts.onChange) opts.onChange(get());
  }
  host.addEventListener('input', refresh);
  host.addEventListener('change', (e) => {
    if (e.target.dataset.k === 'preset' && e.target.value) {
      const pr = PRESETS.find((p) => p.id === e.target.value);
      if (pr) { set(pr.pack); toast('📦 Pacote "' + pr.name + '" carregado'); }
      e.target.value = '';
    }
    refresh();
  });
  host.addEventListener('click', (e) => {
    const b = e.target.closest('[data-add]');
    if (!b) return;
    const inp = q(`[data-k=${b.dataset.add}]`);
    inp.value = (+inp.value || 0) + +b.dataset.v;
    refresh();
  });
  set(initial || {});
  return { get, set, isEmpty: () => { const p = get(); return !p.coins && !p.gems && !p.skins && !p.trails && !p.boosts && !p.noAds && p.passSeason === undefined && !p.clubDays; } };
}

/* ================= Login ================= */
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#loginBtn');
  $('#loginErr').textContent = '';
  btn.disabled = true;
  try {
    const who = $('#who').value.trim();
    try { localStorage.setItem('bo-admin-who', who); } catch (e3) {}
    const r = await api('POST', '/login', { password: $('#pw').value, who });
    token = r.token;
    ROLE = r.role || 'owner';
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e2) {}
    $('#pw').value = '';
    await start();
  } catch (err) {
    $('#loginErr').textContent = err.message;
  } finally { btn.disabled = false; }
});
function logout(expired) {
  token = '';
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $$('.modal-bg').forEach((m) => m.remove());
  document.body.style.overflow = '';
  if (expired === true) $('#loginErr').textContent = 'Sua sessão expirou. Entre novamente.';
}
async function start() {
  if (!token) return logout();
  try {
    const me = await api('GET', '/me');
    ROLE = me.role === 'mod' ? 'mod' : 'owner';
    if (ROLE === 'owner') {
    const [cat, pre, sea] = await Promise.all([api('GET', '/catalog'), api('GET', '/presets'), api('GET', '/seasons')]);
    CATALOG = cat; PRESETS = pre.items; SEASONS = sea; PRODUCTS = cat.products || {};
    CATALOG.skins.forEach((s) => (NAMES['s:' + s.id] = s.name));
    CATALOG.trails.forEach((t) => (NAMES['t:' + t.id] = t.name));
    }
    $$('#nav button').forEach((b) => b.classList.toggle('hidden', ROLE === 'mod' && !MOD_TABS.includes(b.dataset.tab)));
    $$('.brandrow .muted').forEach((el) => (el.textContent = ROLE === 'mod' ? 'Moderador: ' + (me.who || '') : 'Painel admin'));
  } catch (e) {
    if (token) { $('#login').classList.remove('hidden'); $('#loginErr').textContent = e.message; }
    return;
  }
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  const hash = location.hash.slice(1);
  const ok = ROLE === 'mod' ? MOD_TABS : ALL_TABS;
  go(ok.includes(hash) ? hash : ok[0]);
}
$('#nav').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });
function go(tab) {
  if (ROLE === 'mod' && !MOD_TABS.includes(tab)) tab = 'ugc';
  currentTab = tab;
  history.replaceState(null, '', '#' + tab);
  $$('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  window.scrollTo(0, 0);
  const nb = $(`#nav button[data-tab=${tab}]`); if (nb && nb.scrollIntoView) nb.scrollIntoView({ block: 'nearest', inline: 'center' });
  ({ dash: viewDash, players: viewPlayers, payments: viewPayments, audit: viewAudit, gifts: viewGifts, codes: viewCodes, challenges: viewChallenges, presets: viewPresets, ranking: viewRanking, moderation: viewModeration, champs: viewChamps, beta: viewBeta, ugc: viewUgc, mods: viewMods })[tab]();
}
const view = () => $('#view');


/* ================= Moderação da Loja de Criações + TV Bloop (docs/LOJA-TV.md) ================= */
const ugcState = { status: 'review', type: '' };
const UGC_STATUS = { pending: '⏳ Em análise', hidden: '🙈 Oculto (denúncias)', approved: '✅ Aprovado', rejected: '⛔ Recusado' };
const UGC_TYPE = { criacao: '🧱 Criação', filme: '📺 Filme' };
const UGC_REASONS = ['Imagem imprópria nas miniaturas', 'Palavrão ou texto ofensivo', 'Dados pessoais (nome, contato, endereço)', 'Voz/áudio impróprio', 'Conteúdo assustador ou violento demais', 'Cópia de outra pessoa', 'Spam / sem conteúdo'];
async function viewUgc() {
  view().innerHTML = `<div class="page-head"><div><h2>Moderação — Loja &amp; TV</h2><p class="muted">Tudo o que os jogadores publicam (criações do Bloop Studio e filmes para a TV Bloop) entra aqui e só aparece para os outros depois de <b>aprovado</b>. Olhe as miniaturas, os textos marcados pelo filtro e ouça as vozes dos filmes.</p></div>
      <button class="btn ghost sm" onclick="viewUgc()">Atualizar</button></div>
    <div class="stats" id="ugStats"></div>
    <div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <select id="ugStatus"><option value="review">Para revisar (novos + ocultos por denúncia)</option><option value="pending">Em análise</option><option value="hidden">Ocultos por denúncia</option><option value="approved">Aprovados</option><option value="rejected">Recusados</option><option value="all">Todos</option></select>
      <select id="ugType"><option value="">Criações e filmes</option><option value="criacao">Só criações</option><option value="filme">Só filmes</option></select>
      <span class="muted small" id="ugCount"></span></div>
      <div id="ugList" style="margin-top:12px">${spinner()}</div></div>
    <div class="card"><div class="card-head"><h3>Autores banidos da Loja/TV</h3></div><div id="ugBans">${spinner()}</div></div>`;
  $('#ugStatus').value = ugcState.status;
  $('#ugType').value = ugcState.type;
  $('#ugStatus').onchange = (e) => { ugcState.status = e.target.value; loadUgc(); };
  $('#ugType').onchange = (e) => { ugcState.type = e.target.value; loadUgc(); };
  api('GET', '/ugc/stats').then((d) => {
    const c = d.counts, n = (t, s) => (c[t] && c[t][s]) || 0;
    $('#ugStats').innerHTML = [['Criações em análise', n('criacao', 'pending') + n('criacao', 'hidden')], ['Filmes em análise', n('filme', 'pending') + n('filme', 'hidden')], ['Criações na loja', n('criacao', 'approved')], ['Filmes na TV', d.tv]]
      .map(([l, v]) => `<div class="stat"><div class="muted small">${l}</div><div class="v">${fmtN(v)}</div></div>`).join('');
  }).catch(() => {});
  loadUgc();
  loadUgcBans();
}
async function loadUgc() {
  let d;
  try { d = await api('GET', `/ugc/queue?status=${ugcState.status}&type=${ugcState.type}`); }
  catch (e) { $('#ugList').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (!$('#ugList')) return;
  $('#ugCount').textContent = d.items.length ? `${d.items.length} item(ns)` : '';
  $('#ugList').innerHTML = d.items.length ? d.items.map(ugcCard).join('') : '<div class="empty">Nada para revisar agora. 🎉</div>';
  ugcBind($('#ugList'));
}
/** miniatura que não abre (arquivo corrompido/enviado antes da validação): caixinha em vez do ícone quebrado */
function ugcBadThumb(img) {
  const d = document.createElement('div');
  d.className = 'ugc-nothumb';
  d.textContent = 'foto inválida';
  d.style.cssText = 'grid-column:auto;padding:0;aspect-ratio:3/2;display:grid;place-items:center';
  img.replaceWith(d);
}
function ugcCard(it) {
  const m = it.meta || {};
  const info = it.type === 'filme' ? `${m.mode === '3d' ? '3D' : '2D'} · ${fmtN(Math.round(m.dur || 0))} s · ${fmtN(m.clips || 0)} voz(es)` : `${esc(it.kind)} · ${fmtN(m.parts || 0)} peças · ${esc(it.category)}${m.game ? ' · 🎮 Jogo' : ''}`;
  return `<div class="ugc-card" data-id="${esc(it.id)}">
    <div class="ugc-thumbs">${(it.thumbs || []).map((t) => `<img src="${esc(t)}" alt="miniatura" loading="lazy" onerror="ugcBadThumb(this)">`).join('') || '<div class="ugc-nothumb">sem foto</div>'}</div>
    <div class="ugc-body">
      <div><span class="pill">${UGC_TYPE[it.type] || it.type}</span> <span class="pill">${UGC_STATUS[it.status] || it.status}</span> ${ugcAiPill(m.ai)} ${it.reports ? `<span class="pill bad">🚩 ${it.reports} denúncia(s)</span>` : ''} ${it.authorBanned ? '<span class="pill bad">autor banido</span>' : ''}</div>
      <h4>${esc(it.title)}</h4>
      ${it.descr ? `<p class="small">${esc(it.descr)}</p>` : ''}
      <div class="muted small">${info}</div>
      <div class="muted small">por <b>${esc(it.aname)}</b> (${esc(it.aid)}) · enviado ${fmtDate(it.updated)}${it.reviewed ? ` · revisado por ${esc(it.reviewer)} ${ago(it.reviewed)}` : ''}</div>
      ${it.reason ? `<div class="small">Motivo: <b>${esc(it.reason)}</b></div>` : ''}
      ${(it.flags || []).length ? `<ul class="ugc-flags">${it.flags.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : '<div class="small muted">Filtro automático: nada encontrado nos textos.</div>'}
      <div class="ugc-acts">
        <button class="btn ghost sm" data-ug="open">🔎 Ver detalhes</button>
        ${it.status !== 'approved' ? '<button class="btn sm" data-ug="approve">✓ Aprovar</button>' : '<button class="btn ghost sm" data-ug="hide">🙈 Tirar do ar</button>'}
        ${it.status !== 'rejected' ? '<button class="btn danger sm" data-ug="reject">✗ Recusar</button>' : ''}
        ${it.authorBanned ? '' : `<button class="btn ghost sm" data-ug="ban" data-pid="${esc(it.author)}" data-name="${esc(it.aname)}">🚫 Banir autor</button>`}
      </div></div></div>`;
}
const AI_SRC = { whisper: 'Whisper (Workers AI)', device: 'transcrição do aparelho', mock: 'simulada (teste local)', none: 'sem transcrição', mixed: 'mista' };
function ugcAiPill(ai) {
  if (!ai) return '';
  const src = ai.src === 'whisper' ? '' : ai.src === 'device' ? ' · só aparelho' : ai.src === 'mock' ? ' · teste' : ai.src === 'none' ? ' · sem transcrição' : '';
  if (ai.v === 'reject') return `<span class="pill bad">🤖 IA: recusou${src}</span>`;
  if (ai.v === 'review') return `<span class="pill warn">🤖 IA: atenção${src}</span>`;
  return `<span class="pill on">🤖 IA: ok${src}</span>`;
}
/** Texto com os trechos achados pela IA destacados (<mark>). */
function ugcMark(text, hits) {
  let h = esc(text || '');
  for (const w of (hits || []).filter((x) => x && x.length > 1).sort((a, b) => b.length - a.length)) {
    const re = new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    h = h.replace(re, (x) => `<mark>${x}</mark>`);
  }
  return h;
}
function ugcFilmLines(c) {
  const ai = c.ai || null;
  const texts = new Map(((ai && ai.texts) || []).map((x) => [x.n, x]));
  return (c.lines || []).map((l, i) => {
    const n = i + 1;
    const tx = ai && l.audio ? (ai.clips || {})[l.audio] : null;
    const tb = texts.get(n);
    const txHtml = l.audio
      ? (tx
        ? `<div class="ugc-tx ${tx.level}"><span class="muted">🎙️ ouvido pela IA (${esc(AI_SRC[tx.src] || tx.src)}):</span><br>${tx.tx ? ugcMark(tx.tx, tx.hits) : '<i class="muted">(silêncio / nada entendido)</i>'}</div>`
        : '<div class="ugc-tx"><span class="muted">🎙️ sem relatório da IA (envio antigo) — ouça</span></div>')
      : '<div></div>';
    return `<div class="ugc-line"><div class="small"><b>${n}. ${esc(l.who || '—')}:</b> <span class="ugc-tx ${tb ? tb.level : ''}" style="display:inline;padding:0 4px">${tb ? ugcMark(l.t, tb.hits) : esc(l.t || '')}</span>${l.audio && c.clips && c.clips[l.audio] ? `<br><audio controls preload="none" src="${esc(c.clips[l.audio])}"></audio>` : ''}</div>${txHtml}</div>`;
  }).join('');
}
function ugcBind(host) {
  $$('[data-ug]', host).forEach((b) => (b.onclick = () => {
    const id = b.closest('[data-id]').dataset.id;
    const a = b.dataset.ug;
    if (a === 'open') return busy(b, () => openUgc(id));
    if (a === 'approve') return busy(b, async () => { await api('POST', `/ugc/item/${encodeURIComponent(id)}/review`, { status: 'approved' }); toast('✅ Aprovado — já aparece para todos'); $$('.modal-bg').forEach((m) => m.remove()); document.body.style.overflow = ''; loadUgc(); });
    if (a === 'reject' || a === 'hide') return ugcReason(a === 'hide' ? 'Tirar do ar' : 'Recusar', async (reason) => {
      await api('POST', `/ugc/item/${encodeURIComponent(id)}/review`, { status: a === 'hide' ? 'hidden' : 'rejected', reason });
      toast(a === 'hide' ? 'Tirado do ar' : '⛔ Recusado'); $$('.modal-bg').forEach((m) => m.remove()); document.body.style.overflow = ''; loadUgc();
    });
    if (a === 'ban') return ugcReason('Banir ' + b.dataset.name + ' da Loja/TV (tudo dele sai do ar)', async (reason) => {
      const r = await api('POST', '/ugc/ban', { pid: b.dataset.pid, reason });
      toast(`🚫 Autor banido — ${r.removed} item(ns) fora do ar`); $$('.modal-bg').forEach((m) => m.remove()); document.body.style.overflow = ''; loadUgc(); loadUgcBans();
    });
  }));
}
function ugcReason(title, fn) {
  const m = modal(`<div class="modal-head"><h3>${esc(title)}</h3></div>
    <p class="muted small">O motivo aparece para o autor ("Recusada: …"). Seja gentil e claro — o público tem 13+.</p>
    <div class="chips">${UGC_REASONS.map((r) => `<button type="button" class="chip" data-r="${esc(r)}">${esc(r)}</button>`).join('')}</div>
    <label class="field">Motivo<input id="ugReason" maxlength="160" placeholder="Escreva ou escolha acima" /></label>
    <div class="modal-foot"><button class="btn ghost" data-close>Cancelar</button><button class="btn danger" id="ugReasonOk">Confirmar</button></div>`, 'sm');
  $$('[data-r]', m.el).forEach((c) => (c.onclick = () => ($('#ugReason', m.el).value = c.dataset.r)));
  $('#ugReasonOk', m.el).onclick = (e) => busy(e.currentTarget, async () => {
    const reason = $('#ugReason', m.el).value.trim();
    if (!reason) throw new Error('Escreva o motivo.');
    await fn(reason); m.close();
  });
}
async function openUgc(id) {
  const d = await api('GET', '/ugc/item/' + encodeURIComponent(id));
  const it = d.item, c = d.content || {};
  let body = '';
  if (it.type === 'filme') {
    body = `<h4>Elenco</h4><p class="small">${(c.cast || []).map(esc).join(', ') || '—'}</p>
      ${c.ai ? `<p class="small">🤖 Moderação por IA: <b>${c.ai.verdict === 'reject' ? 'recusado automaticamente' : c.ai.verdict === 'review' ? 'pediu atenção' : 'ok'}</b> · transcrição: ${esc(AI_SRC[c.ai.src] || c.ai.src)} · Claude: ${esc(c.ai.llm)}</p>` : '<p class="small muted">🤖 Sem relatório da IA (envio anterior à moderação por IA).</p>'}
      <h4>Falas (${(c.lines || []).length}) — texto do balão · áudio · o que a IA ouviu</h4><div class="ugc-lines" style="max-height:420px">${ugcFilmLines(c) || '<span class="muted">sem falas</span>'}</div>`;
  } else {
    body = `<h4>Conteúdo</h4><p class="small">${esc(c.kind || '')} · ${fmtN(c.parts || 0)} peças</p>
      ${(c.partNames || []).length ? `<p class="small">Nomes das peças: ${c.partNames.map(esc).join(', ')}</p>` : ''}
      ${c.game ? `<p class="small">🎮 <b>${esc(c.game.title)}</b> — ${esc(c.game.desc)} · etiquetas: ${(c.game.tags || []).map(esc).join(', ')}</p>` : ''}
      ${c.mission ? `<pre class="small mono" style="white-space:pre-wrap;max-height:140px;overflow:auto">${esc(JSON.stringify(c.mission, null, 1))}</pre>` : ''}`;
  }
  const reps = (it.reportList || []).map((r) => `<li class="small">${esc(r.reason)}${r.note ? ' — ' + esc(r.note) : ''} <span class="muted">${ago(r.t)}</span></li>`).join('');
  const m = modal(`<div class="modal-head"><h3>${esc(it.title)}</h3><button class="btn ghost sm" data-close>✕</button></div>
    <div class="ugc-thumbs big">${(it.thumbs || []).map((t) => `<img src="${esc(t)}" alt="miniatura" onerror="ugcBadThumb(this)">`).join('')}</div>
    <p class="muted small">${UGC_TYPE[it.type]} · ${UGC_STATUS[it.status]} · por <b>${esc(it.aname)}</b> (${esc(it.aid)}) · id do jogador <span class="mono">${esc(it.author)}</span></p>
    ${(it.flags || []).length ? `<ul class="ugc-flags">${it.flags.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
    ${body}
    ${reps ? `<h4>Denúncias</h4><ul>${reps}</ul>` : ''}
    <div class="ugc-acts" data-id="${esc(it.id)}">
      ${it.status !== 'approved' ? '<button class="btn" data-ug="approve">✓ Aprovar</button>' : '<button class="btn ghost" data-ug="hide">🙈 Tirar do ar</button>'}
      ${it.status !== 'rejected' ? '<button class="btn danger" data-ug="reject">✗ Recusar</button>' : ''}
      ${it.authorBanned ? '' : `<button class="btn ghost" data-ug="ban" data-pid="${esc(it.author)}" data-name="${esc(it.aname)}">🚫 Banir autor</button>`}
    </div>`, 'wide');
  ugcBind(m.el);
}
async function loadUgcBans() {
  let d;
  try { d = await api('GET', '/ugc/bans'); } catch (e) { if ($('#ugBans')) $('#ugBans').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (!$('#ugBans')) return;
  $('#ugBans').innerHTML = d.items.length ? `<div class="table-wrap"><table><thead><tr><th>Autor</th><th>Motivo</th><th>Quando / quem</th><th></th></tr></thead><tbody>${d.items.map((b) => `<tr><td>${esc(b.aname)}<div class="muted small mono">${esc(b.pid)}</div></td><td class="small">${esc(b.reason)}</td><td class="small">${fmtDate(b.t)}<div class="muted small">${esc(b.by)}</div></td><td><button class="btn ghost sm" data-unban="${esc(b.pid)}">Desbanir</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Ninguém banido.</div>';
  $$('#ugBans [data-unban]').forEach((b) => (b.onclick = () => busy(b, async () => { await api('POST', '/ugc/unban', { pid: b.dataset.unban }); toast('Autor desbanido (os itens antigos continuam recusados)'); loadUgcBans(); })));
}

async function loadMods() {

  $$('#mdList [data-act]').forEach((b) => (b.onclick = () => busy(b, async () => { await api('POST', `/mods/${encodeURIComponent(b.dataset.act)}/active`, { active: b.dataset.to === '1' }); loadMods(); })));
  $$('#mdList [data-del]').forEach((b) => (b.onclick = async () => { if (await ask('Apagar moderador', `Apagar "${b.dataset.del}"? As sessões dele param na hora.`, 'Apagar', true)) busy(b, async () => { await api('DELETE', '/mods/' + encodeURIComponent(b.dataset.del)); toast('Moderador apagado'); loadMods(); }); }));
}


/* ================= Beta / Bugs (relatórios do Programa Beta) ================= */
const betaState = { status: 'open', cat: '' };
const BETA_CATS = { physics: 'Física', crash: 'Jogo travou', visual: 'Visual', sound: 'Som', shop: 'Loja', other: 'Outro' };
async function viewBeta() {
  view().innerHTML = `<div class="page-head"><div><h2>Beta / Bugs</h2><p class="muted">Relatórios enviados pelos testadores (Ajustes → Programa Beta → Reportar bug). Ficam guardados por 120 dias. Veja docs/BETA-TESTERS.md.</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" id="bgExport">⬇ Baixar JSON</button><button class="btn ghost sm" onclick="viewBeta()">Atualizar</button></div></div>
    <div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <select id="bgStatus"><option value="open">Abertos</option><option value="resolved">Resolvidos</option><option value="all">Todos</option></select>
      <select id="bgCat"><option value="">Todas as categorias</option>${Object.entries(BETA_CATS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
      <span class="muted small" id="bgCounts"></span></div>
      <div id="bgList" style="margin-top:12px">${spinner()}</div></div>`;
  $('#bgStatus').value = betaState.status;
  $('#bgCat').value = betaState.cat;
  $('#bgStatus').onchange = (e) => { betaState.status = e.target.value; loadBeta(); };
  $('#bgCat').onchange = (e) => { betaState.cat = e.target.value; loadBeta(); };
  $('#bgExport').onclick = (e) => busy(e.currentTarget, async () => {
    const res = await fetch('/api/admin/feedback/export', { headers: { authorization: 'Bearer ' + token } });
    if (!res.ok) throw new Error('Erro ' + res.status);
    download('bloop-bugs-' + new Date().toISOString().slice(0, 10) + '.json', await res.text(), 'application/json');
  });
  loadBeta();
}
async function loadBeta() {
  let d;
  try { d = await api('GET', '/feedback?status=' + betaState.status + '&cat=' + encodeURIComponent(betaState.cat)); }
  catch (e) { $('#bgList').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (!$('#bgList')) return;
  $('#bgCounts').textContent = `${fmtN(d.counts.open)} abertos · ${fmtN(d.counts.resolved)} resolvidos`;
  $('#bgList').innerHTML = d.items.length ? `<div class="table-wrap"><table><thead><tr><th>Quando</th><th>Categoria</th><th>Relato</th><th class="hide-m">Jogador / app</th><th></th></tr></thead><tbody>
    ${d.items.map((r) => `<tr><td class="small">${fmtDate(r.t)}<div class="muted small">${esc(r.where)}</div></td>
      <td class="small"><b>${esc(BETA_CATS[r.cat] || r.cat)}</b>${r.shot ? ' 📷' : ''}${r.errs ? `<div class="muted small">${r.errs} erro(s)</div>` : ''}</td>
      <td class="small">${esc(r.text)}</td>
      <td class="hide-m small">${esc(r.name || '—')}${r.handle ? ' @' + esc(r.handle) : ''}<div class="muted small">v${esc(r.v)} · ${esc(r.plat)}</div></td>
      <td style="white-space:nowrap"><button class="btn ghost sm" data-open="${esc(r.key)}">Abrir</button>
        <button class="btn ghost sm" data-res="${esc(r.key)}" data-to="${r.st === 'open' ? '1' : '0'}">${r.st === 'open' ? '✓ Resolver' : 'Reabrir'}</button></td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">Nenhum relatório aqui. 🎉</div>';
  $$('#bgList [data-open]').forEach((b) => (b.onclick = () => busy(b, () => openBeta(b.dataset.open))));
  $$('#bgList [data-res]').forEach((b) => (b.onclick = () => busy(b, async () => {
    await api('POST', '/feedback/resolve', { key: b.dataset.res, resolved: b.dataset.to === '1' });
    toast(b.dataset.to === '1' ? 'Marcado como resolvido' : 'Reaberto'); loadBeta();
  })));
}
async function openBeta(key) {
  const r = await api('GET', '/feedback/item?key=' + encodeURIComponent(key));
  const ctx = r.ctx || {};

function pidCell(pid, name) {
  return `<b>${esc(name || '—')}</b><div class="muted small mono" title="${esc(pid)}">${esc(String(pid).slice(0, 13))}…</div>`;

function fillPid(pid) { const i = $('#mdPid'); if (i) { i.value = pid; i.scrollIntoView({ behavior: 'smooth', block: 'center' }); i.focus(); } }
async function loadReports() {

async function loadRecent() {

async function loadBans() {

/* ================= Casas & @nomes (dentro de Moderação) ================= */
const homeApiA = (method, path, body) => fetch('/api/admin/home' + path, {
  method, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token }, body: body === undefined ? undefined : JSON.stringify(body),
}).then(async (r) => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.message || 'Erro ' + r.status); return d; });
async function homeLookup(raw) {
  const h = String(raw || '').trim().replace(/^@+/, '').toLowerCase();
  if (!h) throw new Error('Digite um @nome');
  const out = $('#hmOut');
  let d;
  try { d = await homeApiA('GET', '/handle?h=' + encodeURIComponent(h)); } catch (e) { out.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (d.banned) { out.innerHTML = `<div class="pill">@${esc(h)} está banido</div>`; return; }
  const home = await homeApiA('GET', '/home?id=' + encodeURIComponent(d.id)).catch(() => null);
  const messN = home?.mess?.mess?.length ?? 0;
  out.innerHTML = `<div><b>@${esc(d.handle)}</b> — ${esc(d.profile?.name || '—')} <span class="muted small mono">${esc(d.id)}</span>
      <div class="muted small">nome escolhido em ${d.at ? fmtDate(d.at) : '—'} · sujeira: ${messN} itens · festa agora: ${home?.party?.members?.length ?? 0} pessoa(s)</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"><input id="hmNew" type="text" placeholder="novo @nome" style="min-width:160px" />
      <button class="btn sm" id="hmRename">Renomear</button><button class="btn danger sm" id="hmBan">Banir este @nome</button>
      <button class="btn ghost sm" id="hmClear">Limpar sujeira</button><button class="btn ghost sm" id="hmPid">Usar ID na moderação</button></div>
    <details><summary class="small">JSON da casa</summary><pre class="small mono" style="white-space:pre-wrap;max-height:320px;overflow:auto">${esc(JSON.stringify(home?.home ?? null, null, 2))}</pre></details>`;
  $('#hmRename').onclick = (e) => busy(e.currentTarget, async () => { const r = await homeApiA('POST', '/handle/rename', { id: d.id, handle: $('#hmNew').value }); toast('Agora é @' + r.handle); homeLookup(r.handle); });
  $('#hmBan').onclick = (e) => busy(e.currentTarget, async () => { if (!confirm('Banir @' + h + '? O jogador terá que escolher outro nome.')) return; await homeApiA('POST', '/handle/ban', { handle: h }); toast('@nome banido'); homeLookup(h); });
  $('#hmClear').onclick = (e) => busy(e.currentTarget, async () => { await homeApiA('POST', '/home/clear-mess', { id: d.id }); toast('Sujeira limpa'); homeLookup(h); });
  $('#hmPid').onclick = () => fillPid(d.id);
}

const FILTER_OPTS = [['all', 'Todos'], ['active1', 'Ativos 24 h'], ['active7', 'Ativos 7 dias'], ['active30', 'Ativos 30 dias'], ['subs', '⭐ Assinantes do Clube'], ['payers', '💳 Já compraram'], ['beta', '🐞 Beta testers'], ['mod', '🛡️ Moderadores'], ['vip', '💎 VIP'], ['tester', '🧪 Testers internos'], ['creator', '🎬 Criadores'], ['banned', '🚫 Banidos']];
const FLAG_LABEL = { beta: '🐞 Beta tester', mod: '🛡️ Moderador', vip: '💎 VIP', tester: '🧪 Tester interno', creator: '🎬 Criador de conteúdo' };
const filterSelect = (id, val) => `<select id="${id}">${FILTER_OPTS.map(([v, l]) => `<option value="${v}" ${v === val ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
const platLabel = (p) => (p === 'android' ? '🤖 Android' : p === 'web' ? '🌐 Web' : esc(p || '—'));
function playerBadges(p) {
  const now = Date.now();
  const out = [];
  if (p.banned) out.push('<span class="pill off">🚫 banido</span>');
  if (p.clubUntil > now) out.push(`<span class="pill pink" title="Clube até ${fmtDay(p.clubUntil)}">⭐ Clube</span>`);
  if (p.purchases) out.push(`<span class="pill warn">💳 ${fmtN(p.purchases)}</span>`);
  for (const f of p.flags || []) out.push(`<span class="pill info">${esc((FLAG_LABEL[f] || f).split(' ')[0])} ${esc(f)}</span>`);
  return out.join(' ') || '<span class="muted small">—</span>';
}

async function loadPlayers() {
  const qs = new URLSearchParams({ q: players.q, filter: players.filter, sort: players.sort, page: players.page, size: players.size });
  try { players.data = await api('GET', '/players?' + qs); } catch (e) { if ($('#plist')) $('#plist').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  renderPlayers();
}
function renderPlayers() {
  const d = players.data;
  if (!$('#plist') || !d) return;
  if (!d.items.length) {
    $('#plist').innerHTML = `<div class="empty"><div>🌌</div>${players.q || players.filter !== 'all' ? 'Nenhum jogador encontrado.' : 'Ainda não há jogadores. Eles aparecem aqui quando abrem o jogo conectado à internet.'}</div>`;
  } else {
    const allSel = d.items.every((p) => players.selected.has(p.id));
    const pages = Math.max(1, Math.ceil(d.total / d.size));
    $('#plist').innerHTML = `<div class="row" style="margin:-4px 0 10px;gap:8px;align-items:center"><span class="muted small" style="flex:1 1 auto">${fmtN(d.total)} jogador${d.total === 1 ? '' : 'es'}${players.q || players.filter !== 'all' ? ' neste filtro' : ''}</span>

      <div class="table-wrap"><table class="ptable">

      <tbody>${d.items.map((p) => `<tr class="${players.selected.has(p.id) ? 'sel' : ''}">
        <td><input type="checkbox" class="ck" data-pid="${esc(p.id)}" ${players.selected.has(p.id) ? 'checked' : ''} aria-label="Selecionar ${esc(p.name)}" /></td>
        <td class="clickable" data-open="${esc(p.id)}"><b>${p.handle ? '@' + esc(p.handle) : '<span class="muted">sem @</span>'}</b><div class="small">${esc(p.name)} <span class="muted mono">· ${esc(p.id.slice(0, 8))}</span></div>
          <div class="muted small mobile-only">${ago(p.lastSeen)} · ${platLabel(p.platform)} · 🪙 ${fmtN(p.coins)} 💎 ${fmtN(p.gems)}</div></td>
        <td class="hide-m small">${fmtDay(p.created)}</td>
        <td class="hide-m small">${ago(p.lastSeen)}</td>
        <td class="hide-m small">${platLabel(p.platform)}</td>
        <td class="hide-m small">🪙 ${fmtN(p.coins)}<br>💎 ${fmtN(p.gems)}</td>
        <td class="small">${playerBadges(p)}</td></tr>`).join('')}</tbody></table></div>
      <div class="pager"><span class="muted small">página ${d.page} de ${pages}</span>
        <span class="row tight" style="flex:0 0 auto;gap:8px"><button class="btn ghost sm" id="pprev" ${d.page <= 1 ? 'disabled' : ''}>← Anterior</button><button class="btn ghost sm" id="pnext" ${d.page >= pages ? 'disabled' : ''}>Próxima →</button></span></div>`;
    $('#pall').onchange = (e) => { d.items.forEach((p) => (e.target.checked ? players.selected.add(p.id) : players.selected.delete(p.id))); renderPlayers(); };
    $$('#plist [data-pid]').forEach((c) => (c.onchange = () => { c.checked ? players.selected.add(c.dataset.pid) : players.selected.delete(c.dataset.pid); renderPlayers(); }));
    $$('#plist [data-open]').forEach((c) => (c.onclick = () => openPlayer(c.dataset.open)));
    $('#pprev').onclick = () => { players.page--; loadPlayers(); };
    $('#pnext').onclick = () => { players.page++; loadPlayers(); };
    $('#pselall').onclick = (e) => busy(e.currentTarget, async () => {
      const r = await api('GET', '/players?' + new URLSearchParams({ q: players.q, filter: players.filter, ids: 1 }));
      r.ids.forEach((id) => players.selected.add(id));
      toast(`☑ ${fmtN(r.ids.length)} marcados`);
      renderPlayers();
    });
  }
  const n = players.selected.size;
  $('#pbar').innerHTML = n ? `<div class="actionbar"><b>✅ ${fmtN(n)} selecionado${n > 1 ? 's' : ''}</b><span class="row tight" style="flex:0 0 auto;gap:8px">

  if (n) {

    $('#pgift').onclick = () => openGiftModal({ type: 'players' });
  }
}

function recipientPicker(host, onChange) {
  const st = { q: '', filter: 'all', page: 1, data: null };
  host.innerHTML = `<div class="row" style="margin-bottom:8px"><label class="field" style="flex:2 1 180px">Buscar<input type="search" data-r="q" placeholder="@nome, apelido ou ID" autocomplete="off" /></label>

    <div class="picker-list" data-r="list">${spinner()}</div>`;
  const q = (k) => host.querySelector(`[data-r=${k}]`);
  async function load() {
    try { st.data = await api('GET', '/players?' + new URLSearchParams({ q: st.q, filter: st.filter, page: st.page, size: 50 })); } catch (e) { q('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    const d = st.data;
    const pages = Math.max(1, Math.ceil(d.total / d.size));
    q('list').innerHTML = (d.items.length ? d.items.map((p) => `<label><input type="checkbox" class="ck" value="${esc(p.id)}" ${players.selected.has(p.id) ? 'checked' : ''} />
      <span style="flex:1 1 auto"><b>${p.handle ? '@' + esc(p.handle) : esc(p.name)}</b> <span class="muted small">${p.handle ? esc(p.name) + ' · ' : ''}${ago(p.lastSeen)}</span></span><span class="small">${playerBadges(p)}</span></label>`).join('') : '<div class="empty">Ninguém encontrado.</div>')
      + (pages > 1 ? `<div class="pager" style="padding:8px 12px"><span class="muted small">${fmtN(d.total)} · pág. ${d.page}/${pages}</span><span class="row tight" style="gap:6px;flex:0 0 auto"><button type="button" class="btn ghost sm" data-pg="-1" ${d.page <= 1 ? 'disabled' : ''}>←</button><button type="button" class="btn ghost sm" data-pg="1" ${d.page >= pages ? 'disabled' : ''}>→</button></span></div>` : '');
    $$('[data-pg]', host).forEach((b) => (b.onclick = () => { st.page += +b.dataset.pg; load(); }));
  }
  let t;
  q('q').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value; st.page = 1; load(); }, 300); });
  q('filter').addEventListener('change', (e) => { st.filter = e.target.value; st.page = 1; load(); });
  q('list').addEventListener('change', (e) => { if (e.target.type === 'checkbox') { e.target.checked ? players.selected.add(e.target.value) : players.selected.delete(e.target.value); onChange(); } });
  q('all').onclick = (e) => busy(e.currentTarget, async () => {

function bindLimits(host) {
  const q = (k) => host.querySelector(`[data-l=${k}]`);
  q('inf').onchange = () => { q('max').disabled = q('inf').checked; if (!q('inf').checked && !q('max').value) q('max').value = 100; };
  q('one').onchange = () => {
    const on = q('one').checked;
    if (on) { q('inf').checked = false; q('max').value = 1; q('per').value = '1'; }
    q('max').disabled = on || q('inf').checked; q('per').disabled = on; q('inf').disabled = on;
  };
  return () => {
    const one = q('one').checked;
    return {
      oneShot: one,
      maxUses: one ? 1 : q('inf').checked ? 0 : Math.max(1, +q('max').value || 1),
      perPlayer: one ? 1 : +q('per').value,
      season: q('season').value === '' ? null : +q('season').value,
      startsAt: fromLocalInput(q('start').value),
      expiresAt: fromLocalInput(q('exp').value),
      allowHandles: q('allow').value.trim(),
    };
  };
}

function codeStatus(c) {
  const now = Date.now();
  if (!c.active) return ['off', 'Desativado'];
  if (c.expiresAt && c.expiresAt <= now) return ['off', 'Expirado'];
  const w = c.season !== null && c.season !== undefined ? (SEASONS.list || []).find((s) => s.index === c.season) : null;
  if (w && now >= w.end) return ['off', 'Temporada acabou'];
  if (c.maxUses && c.uses >= c.maxUses) return ['warn', 'Esgotado'];
  if ((c.startsAt && c.startsAt > now) || (w && now < w.start)) return ['info', 'Agendado'];
  return ['on', 'Ativo'];
}
function codeRules(c) {
  const r = [];
  r.push(c.perPlayer ? `${c.perPlayer}× por jogador` : 'sem limite por jogador');
  if (c.allowHandles && c.allowHandles.length) r.push('🔒 só ' + c.allowHandles.slice(0, 4).join(' ') + (c.allowHandles.length > 4 ? '…' : ''));
  if (c.season !== null && c.season !== undefined) r.push('🗓️ temporada ' + (c.season + 1));
  return r.join(' · ');
}
function filteredCodes() {
  const q = codesState.q.trim().toLowerCase();
  const now = Date.now();
  return codesState.items.filter((c) => {
    if (q && !(c.code.toLowerCase().includes(q) || c.notes.toLowerCase().includes(q) || c.key.toLowerCase().includes(q.replace(/[-\s]/g, '')))) return false;
    if (codesState.batch && c.batch !== codesState.batch) return false;
    const f = codesState.filter;
    if (f === 'active') return codeStatus(c)[1] === 'Ativo';
    if (f === 'inactive') return !c.active;
    if (f === 'expired') return !!c.expiresAt && c.expiresAt <= now;
    if (f === 'full') return !!c.maxUses && c.uses >= c.maxUses;
    return true;
  });
}

  const brl = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

      <div class="card" style="margin:0"><div class="card-head"><h3>📦 Por produto</h3></div>
        ${d.byProduct.length ? `<div class="table-wrap"><table><thead><tr><th>Produto</th><th>Qtde</th><th>Estimativa</th></tr></thead><tbody>${d.byProduct.map((x) => `<tr><td>${esc(x.name)}<div class="muted small">${esc(x.listPrice)}</div></td><td><b>${fmtN(x.n)}</b></td><td class="small">${brl(x.estimate)}</td></tr>`).join('')}</tbody></table></div>
          <p class="muted small">Estimativa = quantidade × preço de tabela (sem impostos, taxa da Google, reembolsos ou promoções).</p>` : '<div class="empty">—</div>'}</div>
    </div>
    <div class="card" style="margin-top:16px"><div class="card-head"><h3>🧾 Compras e assinaturas</h3></div>
      ${d.items.length ? `<div class="table-wrap"><table><thead><tr><th>Quando</th><th>Jogador</th><th>Produto</th><th class="hide-m">Preço</th><th>Status</th></tr></thead><tbody>
        ${d.items.map((x) => `<tr><td class="small">${fmtDate(x.t)}</td><td class="clickable" data-p="${esc(x.pid)}"><b>${esc(x.name)}</b><div class="muted small mono">${esc(x.pid.slice(0, 8))}</div></td>
          <td>${esc(prodName(x.product))}${x.kind === 'subs' && x.expires ? `<div class="muted small">até ${fmtDay(x.expires)}</div>` : ''}<div class="muted small mobile-only">${esc(x.price)}</div></td><td class="hide-m small">${esc(x.price)}<div class="muted mono">${esc(x.orderId || '')}</div></td><td class="small">${purchaseStatus(x)}</td></tr>`).join('')}</tbody></table></div>
        <div class="pager"><span class="muted small">página ${d.page} de ${pages}</span><span class="row tight" style="flex:0 0 auto;gap:8px"><button class="btn ghost sm" id="payprev" ${d.page <= 1 ? 'disabled' : ''}>←</button><button class="btn ghost sm" id="paynext" ${d.page >= pages ? 'disabled' : ''}>→</button></span></div>` : '<div class="empty"><div>💳</div>Nenhuma compra reportada neste período.</div>'}</div>`;

  [/^POST \/gifts$/, '🎁 Enviou presente'], [/^DELETE \/gifts\//, '🗑 Cancelou presente'],
  [/^POST \/codes$/, '🔑 Criou código(s)'], [/^PATCH \/codes\//, '✏️ Editou código'], [/^DELETE \/codes\//, '🗑 Excluiu código'], [/^POST \/codes\/bulk$/, '🔑 Ação em lote de códigos'],
  [/^POST \/players\/[^/]+\/ban$/, '🚫 Baniu jogador'], [/^POST \/players\/[^/]+\/unban$/, '✅ Desbaniu jogador'], [/^POST \/players\/[^/]+\/flags$/, '🏷️ Mudou selos'],
  [/^POST \/players\/[^/]+\/reset-handle$/, '↺ Resetou @nome'], [/^POST \/players\/[^/]+\/notes$/, '📝 Notas do jogador'],
  [/challenges/, '🎬 Desafio'], [/presets/, '📦 Pacote salvo'], [/leaderboard/, '🏆 Ranking'], [/^[A-Z]+ \/social\//, '🛡️ Moderação / campeonatos'], [/feedback/, '🐞 Beta / bugs'], [/^[A-Z]+ \/home\//, '🏠 Casas & @nomes'],
];
const auditLabel = (a) => { for (const [re, l] of AUDIT_LABEL) if (re.test(a)) return l; return a; };
async function viewAudit() {
  view().innerHTML = `<div class="page-head"><div><h2>📜 Registro</h2><p class="muted">Tudo que foi feito no painel: quem, quando e o quê. Entradas antigas somem depois de 1 ano.</p></div></div>
    <div class="card"><div class="row" style="margin-bottom:12px"><label class="field" style="flex:2 1 220px">Buscar<input type="search" id="auq" placeholder="ação, detalhe ou nome" /></label></div><div id="aulist">${spinner()}</div></div>`;
  let items = [];
  const load = async (more) => {
    const qs = new URLSearchParams({ q: $('#auq').value });
    if (more && items.length) qs.set('before', items[items.length - 1].id);
    let d;
    try { d = await api('GET', '/audit?' + qs); } catch (e) { $('#aulist').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    items = more ? items.concat(d.items) : d.items;
    $('#aulist').innerHTML = items.length ? `<div class="table-wrap"><table><thead><tr><th>Quando</th><th>Quem</th><th>O quê</th><th class="hide-m">Detalhes</th></tr></thead><tbody>
      ${items.map((x) => `<tr><td class="small">${fmtDate(x.t)}</td><td class="small">${esc(x.who)}<div class="muted mono">${esc(x.ip)}</div></td>
        <td><b>${esc(auditLabel(x.action))}</b>${x.status >= 400 ? ` <span class="pill off">erro ${x.status}</span>` : ''}<div class="muted small mono">${esc(x.action)}</div><div class="muted small mono mobile-only" style="word-break:break-all">${esc(x.detail.slice(0, 160))}</div></td>
        <td class="hide-m small mono" style="word-break:break-all;max-width:420px">${esc(x.detail)}</td></tr>`).join('')}</tbody></table></div>
      ${d.items.length >= 100 ? '<div style="text-align:center;margin-top:12px"><button class="btn ghost sm" id="aumore">Carregar mais</button></div>' : ''}` : '<div class="empty"><div>📜</div>Nada registrado ainda.</div>';
    const mb = $('#aumore'); if (mb) mb.onclick = () => load(true);
  };
  let t;
  $('#auq').oninput = () => { clearTimeout(t); t = setTimeout(() => load(false), 300); };
  load(false);
}

start();
</script>
</body>
</html>
