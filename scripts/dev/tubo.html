<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dev — Queda Giratória</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a1030; font-family: 'Fredoka', system-ui, sans-serif; color: #fff; }
  #menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #card { width: 92%; max-width: 380px; border-radius: 28px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,.4); }
  #card canvas { display: block; width: 100%; height: 300px; }
  #card .info { padding: 12px 16px 16px; }
  #card h1 { margin: 0; font-size: 30px; }
  #card p { margin: 4px 0 12px; opacity: .9; }
  #play { width: 100%; border: 0; border-radius: 18px; padding: 14px; font: inherit; font-size: 22px; font-weight: 700; color: #fff; cursor: pointer; }
  #root { position: absolute; inset: 0; display: none; }
</style>
</head>
<body>
<div id="menu"><div id="card"><canvas id="sc"></canvas><div class="info"><h1 id="name"></h1><p id="tag"></p><button id="play"></button></div></div></div>
<div id="root"></div>
<script type="module" src="./tubo.ts"></script>
</body>
</html>
