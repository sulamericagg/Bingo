<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Anomalias — mapas 2 (dev)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0620; overflow: hidden; font: 12px/1.3 system-ui, sans-serif; color: #eee; }
  canvas { display: block; }
  #hud { position: fixed; left: 6px; top: 4px; pointer-events: none; text-shadow: 0 1px 2px #000; white-space: pre; }
  #panel { position: fixed; right: 0; top: 0; bottom: 0; width: 300px; overflow: auto; background: rgba(12,8,30,0.88); padding: 8px; box-sizing: border-box; }
  #panel.hide { display: none; }
  #panel h3 { margin: 8px 0 4px; font-size: 12px; color: #ffd35a; }
  #panel button, #panel select { font: inherit; margin: 1px; background: #2a2050; color: #fff; border: 1px solid #554a8a; border-radius: 4px; padding: 2px 5px; cursor: pointer; }
  #panel button.on { background: #b03a6a; }
  .slot { display: flex; gap: 3px; align-items: center; margin: 2px 0; }
  .slot span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toggle { position: fixed; right: 4px; bottom: 4px; z-index: 2; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="panel"></div>
<button id="toggle">painel</button>
<script type="module" src="./anomalias-map2.ts"></script>
</body>
</html>
