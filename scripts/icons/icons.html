<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bloop Orbit — ícones</title>
<style>
  body{margin:0;padding:20px;font-family:Fredoka,system-ui,sans-serif;color:#fff;background:#0b0620}
  h1{margin:0 0 4px;font-size:22px}
  p{margin:0 0 16px;color:#c6b6ff;font-size:13px}
  .sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .cell{border-radius:16px;padding:10px 6px 8px;text-align:center;background:linear-gradient(180deg,rgba(60,30,130,.92),rgba(28,14,64,.82));border:2px solid rgba(190,150,255,.35)}
  .cell svg{flex:none}
  .cell .row{display:flex;flex-wrap:nowrap;align-items:flex-end;justify-content:center;gap:8px}
  .cell .light{background:#f2ecff;border-radius:8px;padding:3px;display:inline-flex}
  .cell small{display:block;margin-top:6px;font-size:12px;color:#c6b6ff}
</style>
</head>
<body>
<h1>Bloop Orbit — folha de ícones</h1>
<p>src/ui/icons.ts · 64px / 32px / 18px / fundo claro</p>
<div class="sheet" id="sheet"></div>
<script type="module" src="./icons.ts"></script>
</body>
</html>
